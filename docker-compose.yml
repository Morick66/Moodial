name: moodial

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: moodial
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://jzmle:change-me@postgres:5432/jzmle?schema=public}
    volumes:
      - app_data:/app/data
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: moodial-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jzmle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-jzmle}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-jzmle} -d $${POSTGRES_DB:-jzmle}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  app_data:
  postgres_data:
